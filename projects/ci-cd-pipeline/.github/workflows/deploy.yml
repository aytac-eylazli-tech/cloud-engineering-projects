name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar -czf app.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.tar.gz
  # Add deployment after configuring AWS OIDC role and a target service.
