AWSTemplateFormatVersion: '2010-09-09'
Description: Starter CodePipeline pipeline; connect a source and deploy stage for your app
Parameters:
  ArtifactBucket:
    Type: String
  ConnectionArn:
    Type: String
    Description: CodeStar connection ARN for GitHub
  RepositoryId:
    Type: String
    Description: owner/repository
  BranchName:
    Type: String
    Default: main
Resources:
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codepipeline.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/*'
              - Effect: Allow
                Action: [codestar-connections:UseConnection]
                Resource: !Ref ConnectionArn
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: {Type: S3, Location: !Ref ArtifactBucket}
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId: {Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: '1'}
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref BranchName
                DetectChanges: 'true'
              OutputArtifacts: [{Name: SourceOutput}]
