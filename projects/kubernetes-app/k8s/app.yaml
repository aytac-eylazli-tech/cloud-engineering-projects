apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: cloud-demo}
  template:
    metadata:
      labels: {app: cloud-demo}
    spec:
      containers:
        - name: app
          image: cloud-demo-app:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-demo
spec:
  selector: {app: cloud-demo}
  ports: [{port: 80, targetPort: 8080}]
  type: ClusterIP
