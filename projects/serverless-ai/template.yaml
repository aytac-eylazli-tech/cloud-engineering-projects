AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless AI content API portfolio example
Parameters:
  ModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
Resources:
  ContentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
  ContentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: .
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref ContentTable
          MODEL_ID: !Ref ModelId
      Policies:
        - DynamoDBWritePolicy: {TableName: !Ref ContentTable}
        - Statement:
            - Effect: Allow
              Action: bedrock: converse
              Resource: '*'
      Events:
        Api:
          Type: Api
          Properties: {Path: /content, Method: post}
Outputs:
  ApiUrl:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/content'
